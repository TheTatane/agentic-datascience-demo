services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    devices:
      - "/dev/kfd"
      - "/dev/dri"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    restart: unless-stopped
